name: Build and Deploy

on: [push]
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: true

      - name: Build
        run: |
          pnpm builddoc

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          single-commit: true
